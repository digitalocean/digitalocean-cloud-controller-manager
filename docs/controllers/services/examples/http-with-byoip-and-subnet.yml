apiVersion: v1
kind: Service
metadata:
  name: http-with-byoip
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    # Optional: assign an unassigned BYOIP address on create (create-only).
    service.beta.kubernetes.io/do-loadbalancer-ip: "203.0.113.10"
    # Optional: place the LB in a specific VPC subnet (private preview).
    service.beta.kubernetes.io/do-loadbalancer-subnet-uuid: "3d6f6fdc-8b7e-49fd-a3c2-0d73ec4e40b4"
spec:
  type: LoadBalancer
  selector:
    app: nginx-example
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-example
  template:
    metadata:
      labels:
        app: nginx-example
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
              protocol: TCP
